name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m py_compile src/*.py tests/*.py
      - name: Engine self-check
        run: python src/persona_evo.py --root .
      - name: Smoke test (full loop + anti-drift constraints)
        run: python tests/test_smoke.py
      - name: Validator on examples
        run: |
          python src/validate_evolution.py \
            --before examples/interaction_log_before.jsonl \
            --after  examples/interaction_log_after.jsonl \
            --dimension policy:P005 | grep -q '"verdict": "promote"'
